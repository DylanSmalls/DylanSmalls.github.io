<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" role="img" aria-labelledby="t d">
  <title id="t">DOGUI.ai voice pipeline</title>
  <desc id="d">The user speaks into a microphone, speech-to-text converts it with IBM watsonx, the AI assistant responds, text-to-speech converts the reply, and it plays through the speaker.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#13294b"/>
    </marker>
  </defs>
  <rect width="640" height="400" rx="12" fill="#ffffff"/>
  <text x="320" y="36" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#13294b">DOGUI.ai Voice Pipeline</text>

  <!-- Top row: input -->
  <rect x="30" y="70" width="160" height="80" rx="10" fill="#f4ead0" stroke="#c9a227" stroke-width="2"/>
  <text x="110" y="105" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#13294b">User speaks</text>
  <text x="110" y="127" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#5b6577">into microphone</text>

  <rect x="240" y="60" width="180" height="100" rx="12" fill="#13294b"/>
  <text x="330" y="100" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#ffffff">Speech-to-Text</text>
  <text x="330" y="122" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#c9a227">IBM watsonx</text>
  <text x="330" y="142" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#c9a227">(built by me)</text>

  <rect x="470" y="70" width="140" height="80" rx="10" fill="#ffffff" stroke="#13294b" stroke-width="2"/>
  <text x="540" y="105" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#13294b">Text query</text>
  <text x="540" y="127" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#5b6577">sent to assistant</text>

  <!-- Middle: assistant -->
  <rect x="440" y="200" width="170" height="80" rx="10" fill="#ffffff" stroke="#13294b" stroke-width="2"/>
  <text x="525" y="235" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#13294b">AI Assistant</text>
  <text x="525" y="257" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#5b6577">generates response</text>

  <!-- Bottom row: output -->
  <rect x="240" y="280" width="180" height="100" rx="12" fill="#13294b"/>
  <text x="330" y="320" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#ffffff">Text-to-Speech</text>
  <text x="330" y="342" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#c9a227">IBM watsonx</text>
  <text x="330" y="362" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#c9a227">(helped build)</text>

  <rect x="30" y="290" width="160" height="80" rx="10" fill="#f4ead0" stroke="#c9a227" stroke-width="2"/>
  <text x="110" y="325" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#13294b">User hears</text>
  <text x="110" y="347" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#5b6577">spoken reply</text>

  <!-- Arrows -->
  <line x1="190" y1="110" x2="236" y2="110" stroke="#13294b" stroke-width="2.5" marker-end="url(#a)"/>
  <line x1="420" y1="110" x2="466" y2="110" stroke="#13294b" stroke-width="2.5" marker-end="url(#a)"/>
  <line x1="540" y1="150" x2="540" y2="196" stroke="#13294b" stroke-width="2.5" marker-end="url(#a)"/>
  <path d="M525,280 L525,330 L424,330" fill="none" stroke="#13294b" stroke-width="2.5" marker-end="url(#a)"/>
  <line x1="240" y1="330" x2="194" y2="330" stroke="#13294b" stroke-width="2.5" marker-end="url(#a)"/>
</svg>
